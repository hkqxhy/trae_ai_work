# Render 平台一键部署配置
# 使用方式：
# 1. 在 https://render.com 注册账号
# 2. New -> Blueprint，选择本项目仓库，Render 会自动识别此文件
# 3. 部署完成后获得公开 HTTPS 链接

services:
  - type: web
    name: renting-radar
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVER_HOST
        value: 0.0.0.0
      - key: AI_SERVER_PORT
        value: 8787
      - key: AI_PROVIDER
        value: mock
      # 如需启用千问真实 AI，在 Render 控制台手动添加以下环境变量：
      # - key: QWEN_API_KEY
      #   sync: false
      # - key: QWEN_MODEL
      #   value: qwen-plus
    healthCheckPath: /api/ai/health
    autoDeploy: true
