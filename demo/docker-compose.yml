# 租房雷达参赛 DEMO 一键部署
# 使用方式：docker compose up --build
# 访问地址：http://localhost:8787

services:
  renting-radar:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    ports:
      - "8787:8787"
    # 从项目根目录 .env 加载千问 Key 等配置（.env 已在 .gitignore，不会泄露）
    env_file:
      - ../.env
    environment:
      # 以下为容器内固定值，覆盖 .env 中可能冲突的项
      - NODE_ENV=production
      - AI_SERVER_HOST=0.0.0.0
      - AI_SERVER_PORT=8787
      # 前后端分离部署时填写前端地址，同源部署留空
      - CORS_ORIGIN=
    restart: unless-stopped
